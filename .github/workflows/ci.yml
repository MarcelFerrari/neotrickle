name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::ForceIPv4=true
          )
          run_apt_install() {
            local attempt
            for attempt in 1 2; do
              if timeout 420 sudo apt-get "${APT_OPTS[@]}" install -y -qq "$@"; then
                return 0
              fi
              echo "apt-get install failed (attempt ${attempt}/2), retrying..." >&2
              sleep 5
            done
            return 1
          }
          timeout 180 sudo apt-get "${APT_OPTS[@]}" update -qq
          run_apt_install build-essential cmake libevent-dev libncurses-dev curl wget
          if [ "${{ matrix.compiler.cc }}" = "clang" ]; then
            run_apt_install clang
          fi

      - name: Install Python test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --timeout 30 --retries 3 -r tests/requirements.txt

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DNTRICKLE_ENABLE_TESTS=ON
          -DNTRICKLE_ENABLE_INTEGRATION_TESTS=ON
          -DNTRICKLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Check formatting
        run: ./format.sh --check

      - name: Run tests
        timeout-minutes: 15
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Install to temporary prefix
        run: cmake --install build --prefix /tmp/ntrickle-install

      - name: Smoke-test installed binaries
        run: |
          /tmp/ntrickle-install/bin/ntrickle -V
          /tmp/ntrickle-install/bin/ntrickle -h
          /tmp/ntrickle-install/bin/ntrickled -V
          /tmp/ntrickle-install/bin/ntrickled -h

  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::ForceIPv4=true
          )
          run_apt_install() {
            local attempt
            for attempt in 1 2; do
              if timeout 420 sudo apt-get "${APT_OPTS[@]}" install -y -qq "$@"; then
                return 0
              fi
              echo "apt-get install failed (attempt ${attempt}/2), retrying..." >&2
              sleep 5
            done
            return 1
          }
          timeout 180 sudo apt-get "${APT_OPTS[@]}" update -qq
          run_apt_install build-essential cmake libevent-dev libncurses-dev valgrind curl wget
          if [ "${{ matrix.compiler.cc }}" = "clang" ]; then
            run_apt_install clang
          fi

      - name: Install Python test dependencies
        timeout-minutes: 10
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --timeout 30 --retries 3 -r tests/requirements.txt

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DNTRICKLE_ENABLE_TESTS=ON
          -DNTRICKLE_ENABLE_INTEGRATION_TESTS=ON
          -DNTRICKLE_ENABLE_VALGRIND_TESTS=ON
          -DNTRICKLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Valgrind tests
        timeout-minutes: 15
        run: ctest --test-dir build --output-on-failure -L valgrind --timeout 300
